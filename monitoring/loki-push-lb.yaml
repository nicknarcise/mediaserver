# Exposes Loki's gateway (push API) on the Compute VLAN via Cilium LB-IPAM so the
# Asustor can ship logs to it. Loki itself stays ClusterIP; this only fronts the
# gateway. Commit this to your ArgoCD/GitOps repo (the logging stack is ArgoCD-managed).
#
# IP comes from CiliumLoadBalancerIPPool "homelab-pool" (10.30.30.200-210; 9 free).
# .200/.201 are taken (k3s node + alloy-syslog), so .202 is requested below.
#
# Verified against the live loki-gateway Service: port 80 -> named targetPort
# "http-metrics" (loki chart 6.55.0). This mirrors that exactly.
apiVersion: v1
kind: Service
metadata:
  name: loki-push-lb
  namespace: logging
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: gateway-lb
  annotations:
    io.cilium/lb-ipam-ips: "10.30.30.202"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/component: gateway
    app.kubernetes.io/instance: loki
    app.kubernetes.io/name: loki
  ports:
    - name: http
      port: 80
      targetPort: http-metrics # named port on the gateway pod (verified)
